name: Export schema v3
on:
  push:
    branches: [schema-export]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.5.0
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - name: Export
        run: |
          sed -i 's/exportSchema = false/exportSchema = true/' app/src/main/java/app/mise/data/Db.kt
          printf '\nksp {\n    arg("room.schemaLocation", "%s/app/schemas")\n}\n' "$GITHUB_WORKSPACE" >> app/build.gradle.kts
          chmod +x gradlew
          ./gradlew :app:kspReleaseKotlin --no-daemon
          ls -R app/schemas
      - name: Save
        run: |
          mkdir -p /tmp/out && cp -r app/schemas /tmp/out/
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git fetch origin schema-export
          git checkout -f schema-export
          mkdir -p exported && cp -r /tmp/out/schemas exported/
          git add exported
          git commit -m "Exported schema v3"
          git push origin schema-export
